# .goreleaser.yml — GoReleaser configuration for Breviary
# Build and publish from CI: goreleaser release --clean
version: 2

project_name: breviary

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    main: ./cmd/breviary/

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

brews:
  - name: breviary
    repository:
      owner: WootWooty
      name: homebrew-tap
    commit_author:
      name: breviary-bot
      email: bot@breviary.io
    homepage: https://github.com/WootWooty/breviary
    description: Runbook automation engine
    license: Apache-2.0

dockers:
  - image_templates:
      - "ghcr.io/WootWooty/breviary:{{ .Version }}"
      - "ghcr.io/WootWooty/breviary:latest"
    dockerfile: Dockerfile
    build_flag_templates:
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description=Runbook automation engine"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source={{ .GitURL }}"