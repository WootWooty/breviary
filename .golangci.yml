# golangci-lint configuration
# https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - revive
    - gofmt
    - misspell
    - goimports
  disable:
    - lll  # line length check — too opinionated for now

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0